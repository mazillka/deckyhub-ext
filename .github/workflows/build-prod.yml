name: Build

# Builds the extension's two packages and keeps each ZIP as an artifact of the run:
# chromium (Chrome, Edge, Opera, Brave, Vivaldi) and firefox.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            script: build-prod
            dist: dist
          - browser: firefox
            script: build-firefox
            dist: dist-firefox
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deckyhub-security-${{ matrix.browser }}
          path: extension/${{ matrix.dist }}/deckyhub-security-${{ matrix.browser }}.zip
          if-no-files-found: error
