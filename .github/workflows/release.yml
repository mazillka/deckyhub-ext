name: Release

# A pushed tag vX.Y.Z (or vX.Y.Z-rc.N, a pre-release) builds both packages and attaches
# them to a GitHub release: deckyhub-security-chromium-vX.Y.Z.zip (Chrome, Edge, Opera,
# Brave, Vivaldi) and deckyhub-security-firefox-vX.Y.Z.zip. The tag must match the
# version in extension/manifest.json, which is what the browser shows.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Check the tag matches the manifest
        run: |
          version="v$(node -p "require('./manifest.json').version")"
          # A pre-release tag (v1.2.0-rc.1) carries the manifest's version before the dash: browsers accept numbers only.
          [[ "${GITHUB_REF_NAME%%-*}" == "$version" ]] || { echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version" >&2; exit 1; }
          [[ "v$(node -p "require('./package.json').version")" == "$version" ]] || { echo "package.json and manifest.json versions differ" >&2; exit 1; }
      - run: npm ci
      - run: npm run build-all
      - name: Name the ZIPs after the release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp dist/deckyhub-security-chromium.zip "$RUNNER_TEMP/release/deckyhub-security-chromium-${GITHUB_REF_NAME}.zip"
          cp dist-firefox/deckyhub-security-firefox.zip "$RUNNER_TEMP/release/deckyhub-security-firefox-${GITHUB_REF_NAME}.zip"
          (cd "$RUNNER_TEMP/release" && sha256sum *.zip | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  # The only job with a write token; it never runs the build.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
